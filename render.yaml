# Ein-Klick-Vorlage für Render (render.com → New → Blueprint → dieses Repository wählen)
services:
  - type: web
    name: treetek-planning-poker
    runtime: node
    plan: free
    region: frankfurt   # Serverstandort in der EU
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NO_BROWSER
        value: "1"
      - key: ACCESS_PASSWORD
        sync: false   # Render fragt beim Anlegen nach dem Passwort
